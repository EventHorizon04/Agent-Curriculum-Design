[project]
name = "curriculum-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "instructor>=1.0",
    "openai>=1.20",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.8",
    "minio>=7.2",
    "pythainlp>=5.0",
    "sentence-transformers>=2.5",
    "keybert>=0.8",
    "bertopic>=0.16",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "polars>=0.20",
    "duckdb>=0.10",
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "unstructured>=0.13",
    "loguru>=0.7",
    "streamlit>=1.32",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curriculum_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
