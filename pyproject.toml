[project]
name = "curriculum-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "instructor>=1.0",
    "openai>=1.20",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "minio>=7.2",
    "pandas>=2.2",
    "polars>=0.20",
    "duckdb>=0.10",
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "unstructured>=0.13",
    "loguru>=0.7",
    "streamlit>=1.32",
    "openpyxl>=3.1.5",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "pandas-stubs>=3.0.3.260530",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curriculum_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The markdown template in this script is one long string, and a markdown
# table row cannot be wrapped without breaking the table.
"scripts/dump_prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "review_chain: run the real api.routes.plos._start_review_job instead of the conftest recorder",
]
