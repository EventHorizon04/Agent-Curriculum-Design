version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ca-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    # Cloud models (gemma4:31b-cloud) run via Ollama Cloud — no local pull needed.
    # To override with local models, change LIGHT_MODEL/HEAVY_MODEL in api env:
    #   docker exec ca-ollama ollama pull scb10x/typhoon2-8b-instruct   # ~4.8GB VRAM (6GB GPU)
    #   docker exec ca-ollama ollama pull qwen2.5:7b                    # ~4.1GB VRAM (6GB GPU)
    #   docker exec ca-ollama ollama pull qwen2.5:14b                   # needs 8GB+ VRAM

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ca-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ca-postgres
    environment:
      POSTGRES_USER: curriculum
      POSTGRES_PASSWORD: curriculum_dev
      POSTGRES_DB: curriculum_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ca-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca-api
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+asyncpg://curriculum:curriculum_dev@postgres:5432/curriculum_agent
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_dev
      LIGHT_MODEL: gemma4:31b-cloud
      HEAVY_MODEL: gemma4:31b-cloud
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant
      - postgres
      - minio
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ca-ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./streamlit_app:/app/streamlit_app
    restart: unless-stopped

volumes:
  ollama-data:
  qdrant-data:
  postgres-data:
  minio-data:
